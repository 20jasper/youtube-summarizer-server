<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Summarize YouTube videos!" />
    <title>YouTube Summarizer</title>
    <script type="module" src="./app.js"></script>
    <style>
      :root {
        --maxw: 105ch;
        --gap: 0.75rem;
      }
      body {
        background-color: #f5f5f5;
        margin: 0;
        margin-inline: clamp(0rem, 1vw, 1.5rem);
      }
      main {
        max-width: var(--maxw);
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin: 0 auto;
      }
      .hidden {
        display: none;
      }
      .flex-col {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      input[type="url"],
      textarea {
        padding: 0.5rem 0.6rem;
        border-radius: 6px;
        border: 1px solid #cdcdcd;
        width: 100%;
      }
      #output {
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        padding: 0.05rem clamp(0.5rem, 5vw, 1.5rem);
        border-radius: 5px;
        background-color: white;
        min-height: 45rem;
      }
      #output[aria-busy="true"] {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>YouTube Summarizer</h1>
        <p>Paste a YouTube link and stream a summary in real time.</p>
      </header>

      <form id="youtube" class="flex-col">
        <label class="flex-col">
          <span>YouTube video link</span>
          <input
            id="yt-link"
            type="url"
            name="link"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="url"
            required
          />
        </label>
        <div>
          <button id="summarize" type="submit">Get summary</button>
          <p>Status: <span id="status" aria-live="polite"></span></p>
        </div>
      </form>

      <article>
        <h2>Summary</h2>
        <div id="output" role="log" aria-live="polite" aria-busy="false"></div>
      </article>

      <hr />

      <section id="ratings" class="hidden">
        <h2>Ratings</h2>
        <p class="hint">Let me know what you think.</p>
        <form id="ratings-form" class="flex-col">
          <div>
            <label
              ><input type="radio" name="rating" value="like" required />
              Like</label
            >
            <label
              ><input type="radio" name="rating" value="dislike" required />
              Dislike</label
            >
          </div>
          <label class="flex-col">
            <span>Message (optional)</span>
            <textarea
              rows="3"
              name="message"
              placeholder="What worked well? What could be better?"
            ></textarea>
          </label>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
  </body>
</html>
