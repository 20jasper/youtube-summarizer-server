<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Summarizer</title>
    <style>
      main {
        max-width: 100ch;
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin: 0 auto;
      }
      .hidden {
        display: none;
      }
      .flex-col {
        display: flex;
        flex-direction: column;
      }
      form,
      input {
        max-width: 20rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>YouTube Summarizer</h1>
      <form id="youtube">
        <label class="flex-col">
          YouTube Video link
          <input type="url" name="link" required />
        </label>
        <button type="submit">Get summary</button>
      </form>
      <div id="ratings">
        <h2>ratings</h2>
        <p>Let me know what you think!</p>
        <form class="flex-col">
          <div>
            <label>
              Like
              <input type="radio" name="rating" value="like" required />
            </label>
            <label>
              Dislike
              <input type="radio" name="rating" value="dislike" required />
            </label>
          </div>
          <label class="flex-col">
            Message (optional)
            <textarea rows="3" name="message"></textarea>
          </label>
          <button type="submit">Submit</button>
        </form>
      </div>
      <div id="output"></div>
    </main>
    <script type="module">
      // @ts-check

      import { attachEventSource } from "./sse.js";

      const PARAM = "url";

      const output = document.querySelector("#output");
      const button = document.querySelector("button");
      const ytForm = document.querySelector("form#youtube");
      const ratingsContainer = document.querySelector("#ratings");
      const ratingsForm = ratingsContainer?.querySelector("form");

      if (!output || !button || !ytForm || !ratingsContainer || !ratingsForm) {
        throw new Error("Required elements not found in the document");
      }

      ratingsForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const rating = formData.get("rating");
        const message = formData.get("message") || "";
        const link = new URLSearchParams(window.location.search).get(PARAM);
        const videoId = new URL(link).searchParams.get("v");

        if (!link) {
          output.innerHTML = "<p>Please provide a video link first.</p>";
          return;
        }

        fetch(`/summary/rating`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ rating, message, videoId }),
        })
          .then((response) => {
            if (response.ok) {
              ratingsContainer.innerHTML =
                "<p>Thank you for your feedback!</p>";
            } else {
              ratingsContainer.innerHTML = "<p>Error submitting feedback</p>";
            }
          })
          .catch((error) => {
            output.innerHTML = `<p>Error submitting feedback: ${error.message}</p>`;
          });
      });

      ytForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const link = event.target.link.value.trim();
        const encoded = encodeURIComponent(link);
        console.log("form submitted", event.target.link.value);
        window.location.search = `?${PARAM}=${encoded}`;
      });

      const link = new URLSearchParams(window.location.search).get(PARAM);
      console.log("getting param", link);

      if (link) {
        const linkElement = `<a href=${link}>${link}</a>`;

        const STREAM_URL_BASE = "/summary";
        const PARAM = "url";

        const url = `${STREAM_URL_BASE}?${PARAM}=${encodeURIComponent(
          link ?? ""
        )}`;

        attachEventSource(output, url);
      } else {
        output.innerHTML = "<p>Please provide a video</p>";
      }
    </script>
  </body>
</html>
