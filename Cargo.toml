[package]
name = "youtube-summarizer-server"
version = "0.1.0"
edition = "2024"

[features]
"dotenv" = ["dep:dotenvy"]
"axiom" = ["dep:tracing-axiom"]

[dependencies]
axum = { version = "0.8.4", features = ["json"] }
axum-macros = "0.5.0"
derive_builder = "0.20.2"
derive_more = { version = "2.0.1", features = ["from"] }
dotenvy = { version = "0.15.7", optional = true }
futures = "0.3.31"
mockall = "0.13.1"
regex = "1.10.6"
reqwest = { version = "0.12.22", features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.35.1", features = [
  "time",
  "rt",
  "sync",
  "rt-multi-thread",
] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-axiom = { version = "0.7.0", optional = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"

[dev-dependencies]
http-body-util = "0.1.3"
httpc-test = "0.1.1"
mime = "0.3.17"
rstest = "0.26.1"
tower = "0.5.2"

[lints.rust]
# deny
macro_use_extern_crate = "deny"
unsafe-code = "deny"
unsafe-op-in-unsafe-fn = "deny"

# warn
ffi-unwind-calls = "warn"
let-underscore-drop = "warn"
missing-abi = "warn"
non-ascii-idents = "warn"
variant-size-differences = "warn"
# groups
unused = { level = "warn", priority = -1 }
rust-2018-idioms = "warn"
rust-2018-compatibility = "warn"
rust-2021-compatibility = "warn"

[lints.clippy]
# deny
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
mod_module_files = "deny"

# warn
# pedantic
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# cargo
negative_feature_names = "warn"
redundant_feature_names = "warn"
# restriction
alloc_instead_of_core = "warn"
as_conversions = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_union_representation = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
modulo_arithmetic = "warn"
needless_raw_strings = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
verbose_file_reads = "warn"

# style
unnecessary_map_or = "warn"

# complexity
manual_is_multiple_of = "warn"
useless_concat = "warn"
